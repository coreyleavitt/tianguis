name: pages

# Rebuilds + deploys https://tianguis.dev on every commit to main that
# touches the index or the site templates. Pure-static; pages content
# is generated by site/scripts/build.py from index.json.

on:
  push:
    branches: [main]
    paths:
      - index.kdl
      - index.json
      - site/**
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue concurrent deploys — coalesce to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Build site
        run: python3 site/scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
