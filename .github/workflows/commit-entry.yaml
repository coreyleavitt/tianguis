name: commit-entry

# Triggered by the dispatch endpoint after it OIDC-verifies the publish
# request. Also supports manual workflow_dispatch for testing + recovery.
#
# This workflow IS the trust authority (see dispatch_security_architecture
# memory). Dispatch only does OIDC verify + identity cross-check; the
# actual cosign signature verification + Rekor attestation happens here,
# under a GH Actions OIDC identity that Sigstore's federation accepts.

on:
  repository_dispatch:
    types: [tianguis-publish]
  workflow_dispatch:
    inputs:
      name:
        description: "Package name"
        required: true
      version:
        description: "Semver-shaped version (v1.2.3 or 1.2.3)"
        required: true
      oci_ref:
        description: "<registry>/<repo>@sha256:<digest>"
        required: true
      upstream:
        description: "Upstream repo URL (https://...)"
        required: true
      signed_by:
        description: "Expected cosign signer identity regexp prefix (used in cosign verify)"
        required: true
      # NOTE: `namespace` input removed in P2.1 — the namespace is now derived
      # inside the binary from the verified OIDC SAN extracted in the cosign step.

permissions:
  contents: write   # commit the new entry to index.kdl + index.json
  id-token: write   # cosign keyless: fetch Fulcio cert under workflow OIDC identity

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps (milpa + nimkdl reads)
        env:
          PAT: ${{ secrets.TIANGUIS_GIT_READ_PAT }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Clone milpa (build tool — pinned)
        # Pinned to a fixed SHA, not floating main HEAD: the build tool must be
        # reproducible, and the pin MUST be >= the P1.2 commit (079dbf0) that
        # taught parse_index the (namespace,name) tuple key. The instant the #32
        # migrated (tuple-keyed) index.kdl lands on main, a pre-P1.2 milpa would
        # choke on it here. Bump deliberately, never below 079dbf0. (RFC
        # rfc-identity-and-resolution-completion §1 deploy-ordering gate.)
        env:
          MILPA_SHA: 130ecd1ed8328fe4b91e35314c7031ed9e72f781
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/coreyleavitt/milpa.git .milpa-tool
          git -C .milpa-tool checkout "$MILPA_SHA"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up oras (OCI artifact pull)
        uses: oras-project/setup-oras@v1
        with:
          version: "1.2.0"

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Fetch deps via milpa
        run: uv run --project .milpa-tool python -m milpa fetch

      - name: Build tianguis CLI
        run: nim c -d:release -d:ssl -o:tianguis src/tianguis_cli.nim

      # Payload arrives via repository_dispatch (client_payload) or
      # workflow_dispatch (inputs). Normalize once.
      - name: Pick payload source
        id: payload
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            P='${{ toJson(github.event.client_payload) }}'
          else
            P='${{ toJson(github.event.inputs) }}'
          fi
          # NOTE: `namespace` removed from key list in P2.1 — no longer passed to add-entry.
          # M9 fix: use heredoc-delimiter form to prevent multiline values from
          # smuggling extra output keys via GITHUB_OUTPUT newline injection.
          for k in name version oci_ref upstream signed_by; do
            v=$(echo "$P" | jq -r --arg k "$k" '.[$k] // ""')
            # Reject values containing newlines before writing — a newline in a
            # payload field would corrupt the GITHUB_OUTPUT format regardless of
            # the heredoc guard below, since ${k}<<EOF_${k} itself must be a
            # single line.
            if [[ "$v" == *$'\n'* ]]; then
              echo "::error::payload field '${k}' contains a newline; rejecting"
              exit 1
            fi
            printf '%s<<%s\n%s\n%s\n' "$k" "EOF_${k}" "$v" "EOF_${k}" >> "$GITHUB_OUTPUT"
          done

      # The actual trust check: verify the author's cosign signature on
      # the OCI artifact. cosign verify checks Fulcio cert + Rekor
      # inclusion proof + that the cert identity matches what the dispatch
      # request claimed in signed_by. If any of those fail, the workflow
      # exits non-zero and nothing gets committed.
      #
      # P2.1: additionally extract the verified SAN from cosign's JSON output
      # and export it. The binary derives the namespace from this SAN — the
      # caller-supplied signed_by input is only used as a regexp prefix for
      # cosign verify; the extracted SAN is the authoritative identity.
      - name: Verify author cosign signature
        id: cosign
        env:
          OCI_REF: ${{ steps.payload.outputs.oci_ref }}
          SIGNED_BY: ${{ steps.payload.outputs.signed_by }}
        run: |
          # The extracted SAN (from cosign's JSON output) is the AUTHORITATIVE
          # identity used by the Nim binary to derive the namespace. The
          # caller-supplied SIGNED_BY is used ONLY as a regexp prefix hint for
          # cosign verify here — it is NOT trusted as the authoritative identity.
          # H2 explanation: because the extracted SAN is authoritative, the
          # --certificate-identity-regexp using caller input is technically
          # defense-in-depth, not the trust anchor. The trust anchor is the
          # extracted SAN that goes into steps.cosign.outputs.san and is passed
          # to the binary as --signed-by. The caller can only narrow (not
          # broaden) the match; the cosign OIDC issuer pin does the actual trust.
          # The reusable publish workflow lives at a stable path; refs
          # vary (refs/heads/main, refs/tags/v1, SHAs). Match prefix.
          COSIGN_OUTPUT=$(cosign verify \
            --certificate-identity-regexp="^${SIGNED_BY}@" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "${OCI_REF}")

          SAN=$(echo "$COSIGN_OUTPUT" | jq -r '.[0].optional.Subject')

          # A missing/empty/null SAN means the jq path is wrong or cosign output
          # changed. Hard-fail here so a bad SAN cannot silently cause every
          # publish to be rejected by the binary's deriveNamespace guard.
          # H3 fix: also guard against jq -r yielding the literal string "null"
          # (happens when the jq path doesn't match — `jq -r` emits "null"
          # instead of empty for missing keys, which passes a bare -z guard).
          # TODO(P2.1 Gate B): verify jq SAN path against real cosign v2.4.0
          # --output json before relying on this. The path .[0].optional.Subject
          # mirrors the cosign v2 verify JSON schema but has NOT been verified
          # against a genuine Fulcio cert + Rekor entry. Run the workflow on a
          # real signed artifact and confirm SAN is non-empty before removing
          # this TODO.
          if [[ -z "$SAN" || "$SAN" == "null" ]]; then
            echo "::error::empty or null SAN from cosign verify --output json; check the jq path .[0].optional.Subject"
            exit 1
          fi

          # Heredoc-delimiter form (consistent with M9 fix on payload fields):
          # prevents a SAN containing a newline from smuggling extra output keys.
          printf '%s<<%s\n%s\n%s\n' "san" "EOF_san" "$SAN" "EOF_san" >> "$GITHUB_OUTPUT"

      - name: Add entry (pulls OCI + content_hash + merges index)
        # P2.1: --namespace removed; the binary derives it from --signed-by (the
        # verified cosign SAN extracted above). --signed-by is now the actual cert
        # SAN, not the caller-supplied regexp prefix used for cosign verify.
        env:
          # Route every interpolated value through env vars (same discipline as
          # the predicate step). GitHub expands `${{ }}` BEFORE the shell parses
          # the line, so an inline `--upstream="${{ ...upstream }}"` with a value
          # containing a `"` is argument injection into the binary (a crafted
          # upstream/oci_ref could smuggle extra `tianguis add-entry` flags).
          # As `"$ARG"` shell expansions, a `"` inside the value stays data, not
          # a quote delimiter, so each flag receives exactly one argument.
          ARG_NAME:      ${{ steps.payload.outputs.name }}
          ARG_VERSION:   ${{ steps.payload.outputs.version }}
          ARG_OCI_REF:   ${{ steps.payload.outputs.oci_ref }}
          ARG_UPSTREAM:  ${{ steps.payload.outputs.upstream }}
          ARG_SIGNED_BY: ${{ steps.cosign.outputs.san }}
        run: |
          ./tianguis add-entry \
            --name="$ARG_NAME" \
            --version="$ARG_VERSION" \
            --oci-ref="$ARG_OCI_REF" \
            --upstream="$ARG_UPSTREAM" \
            --signed-by="$ARG_SIGNED_BY"

      - name: Regenerate index.json
        run: ./tianguis project

      # Build a custom predicate describing this commit decision and attest
      # it to Rekor under the workflow's GH Actions OIDC identity. Third
      # parties can later compare what's in index.kdl against attested
      # decisions in Rekor to catch dispatch-only-side compromise.
      - name: Write attestation predicate
        id: predicate
        env:
          # Pull all interpolated values into env vars so jq --arg receives
          # them as safe shell variables, not as inline GitHub expression
          # expansions inside a JSON heredoc. A `"` in any of these values
          # would otherwise inject into the JSON and corrupt the Rekor
          # attestation (T2 fix).
          PRED_NAME:          ${{ steps.payload.outputs.name }}
          PRED_VERSION:       ${{ steps.payload.outputs.version }}
          PRED_OCI_REF:       ${{ steps.payload.outputs.oci_ref }}
          PRED_UPSTREAM:      ${{ steps.payload.outputs.upstream }}
          # H2 + T2: use the EXTRACTED SAN (verified cert identity), not the
          # caller-supplied signed_by regexp. The extracted SAN is what cosign
          # actually verified against the Fulcio cert + Rekor entry, and is
          # what index.kdl records. Using the caller input here would create
          # an audit trail mismatch between Rekor and index.kdl.
          PRED_SIGNED_BY:     ${{ steps.cosign.outputs.san }}
          PRED_TIANGUIS_REPO: ${{ github.repository }}
          PRED_WORKFLOW_RUN:  ${{ github.run_id }}
        run: |
          # jq --arg passes each value through its JSON string encoder, so
          # quotes, backslashes, newlines, and other control characters in any
          # field are properly escaped. No heredoc string interpolation.
          jq -n \
            --arg name          "$PRED_NAME" \
            --arg version       "$PRED_VERSION" \
            --arg oci_ref       "$PRED_OCI_REF" \
            --arg upstream      "$PRED_UPSTREAM" \
            --arg signed_by     "$PRED_SIGNED_BY" \
            --arg tianguis_repo "$PRED_TIANGUIS_REPO" \
            --arg workflow_run  "$PRED_WORKFLOW_RUN" \
            --arg verified_at   "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              name:          $name,
              version:       $version,
              oci_ref:       $oci_ref,
              upstream:      $upstream,
              signed_by:     $signed_by,
              tianguis_repo: $tianguis_repo,
              workflow_run:  $workflow_run,
              verified_at:   $verified_at
            }' > predicate.json
          echo "path=predicate.json" >> "$GITHUB_OUTPUT"

      - name: Cosign attest commit decision
        env:
          OCI_REF: ${{ steps.payload.outputs.oci_ref }}
        run: |
          # attest-blob (not `attest`) because the attestation lives in
          # Rekor only — `cosign attest` tries to write an OCI sidecar
          # alongside the author's artifact, which lives in a namespace
          # tianguis doesn't have push access to. Rekor is the actual
          # transparency layer we care about anyway.
          cosign attest-blob \
            --yes \
            --type custom \
            --predicate "${{ steps.predicate.outputs.path }}" \
            --bundle commit-attest.bundle \
            "${{ steps.predicate.outputs.path }}"
          echo "Rekor bundle written to commit-attest.bundle (subject=predicate.json; predicate names oci_ref=${OCI_REF})"

      - name: Commit + push if changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "no changes (already up-to-date)"
            exit 0
          fi
          git config user.name "tianguis-bot"
          git config user.email "tianguis-bot@users.noreply.github.com"
          git add index.kdl index.json
          git commit -m "publish: ${{ steps.payload.outputs.name }} ${{ steps.payload.outputs.version }} (run:${{ github.run_id }})"
          # Rebase before push — another commit (vendor pass, parallel
          # publish, etc.) may have landed during this workflow.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed; will retry"
            sleep $((i * 2))
          done
