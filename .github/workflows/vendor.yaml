name: vendor

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: write          # to commit + push updated index.kdl / alerts.kdl
  id-token: write          # cosign keyless: attest the vendor pass under workflow identity

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Rewrite every github.com URL form to authenticated https using a
      # fine-grained PAT scoped to milpa + nimkdl read-only. This applies
      # globally for this job, so both this step's explicit clone of milpa
      # AND milpa's subprocess clones (which fetch nimkdl) inherit auth
      # transparently — no per-clone token interpolation, no ssh-agent.
      - name: Configure git auth for private deps
        env:
          PAT: ${{ secrets.TIANGUIS_GIT_READ_PAT }}
        run: |
          # insteadOf is multi-valued; --add to avoid overwriting previous.
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Clone milpa
        run: git clone --depth 1 https://github.com/coreyleavitt/milpa.git .milpa-tool

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v7
        with:
          # Cache disabled: setup-uv's cache-dependency-glob recursively walks
          # the workspace (incl. the cloned .milpa-tool/), and milpa's
          # conformance corpus carries an intentional cyclic-symlink fixture
          # (fixture-309-ws-member-cyclic-symlink) that ELOOPs the walk. The
          # cache only saves seconds on milpa's small pydep set.
          enable-cache: false

      - name: Install milpa deps
        working-directory: .milpa-tool/impls/python
        run: uv sync

      - name: Expose milpa on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/milpa" <<'SH'
          #!/usr/bin/env bash
          exec uv run --project "$GITHUB_WORKSPACE/.milpa-tool/impls/python" python -m milpa "$@"
          SH
          chmod +x "$HOME/.local/bin/milpa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch deps via milpa
        run: uv run --project .milpa-tool/impls/python python -m milpa fetch

      - name: Build tianguis CLI
        run: nim c -d:release -d:ssl -o:tianguis src/tianguis_cli.nim

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      # --- rfc-attestation-delivery S7b (tianguis#42) --------------------
      # Per-entry attestation bundles (the DSSE/Sigstore bundle a milpa
      # `entry-trust "strict"` client verifies per-package) can only be
      # MINTED under real GitHub Actions OIDC — signing needs a Fulcio cert
      # + Rekor inclusion, and milpa's verifier hardcodes issuer
      # `https://token.actions.githubusercontent.com` (see the handoff's
      # "HARD CONSTRAINT" note). The `tianguis` binary itself therefore
      # never signs anything; it only decides WHAT needs signing and later
      # ADMITS the result. Three steps:
      #
      #   1. `tianguis vendor --emit-bundle-candidates=candidates.json` runs
      #      the normal vendor pass (network, git clones, merges everything
      #      it can) and additionally writes every post-epoch entry that
      #      still lacks a bundle pin to candidates.json — enough fields to
      #      both mint AND later re-merge it with NO second upstream fetch
      #      (src/tianguis/vendor/candidates.nim).
      #   2. This job mints one Sigstore bundle per candidate via
      #      scripts/mint_bundle.py (sigstore-python under ambient OIDC —
      #      cosign CLI cannot set an arbitrary subject digest, see the
      #      handoff's RESOLVED minting recipe) and writes pins.json: each
      #      candidate augmented with the minted `bundle_pin`.
      #   3. `tianguis vendor --bundle-pins=pins.json` re-reads index.kdl
      #      and the pins file — NO network, NO Driver — and merges each
      #      now-pinned entry in. The S5 epoch gate passes because the pin
      #      is present.
      - name: Run vendor pass (emit bundle candidates)
        run: ./tianguis vendor --emit-bundle-candidates=candidates.json

      - name: Set up Python (for sigstore signing)
        if: hashFiles('candidates.json') != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install sigstore
        if: hashFiles('candidates.json') != ''
        run: pip install -r scripts/requirements.txt

      # Mint one bundle per candidate. Every value fed to mint_bundle.py
      # comes from candidates.json (this job's own prior output), not from
      # any GitHub context — nothing here is `${{ }}`-interpolated into the
      # shell, so there's no expand-before-shell-parses injection surface;
      # values are still passed as properly quoted `"$var"` shell
      # expansions (never string-concatenated into a command) and pins.json
      # is assembled via `jq --arg`/`--argjson`, never string concatenation,
      # so no candidate field (all attacker-reachable: they originate from
      # upstream nim-lang/packages.json entries) can smuggle extra JSON keys
      # or shell arguments.
      - name: Mint attestation bundles for pending candidates
        if: hashFiles('candidates.json') != ''
        run: |
          mkdir -p attestation
          echo '[]' > pins.json
          count=$(jq 'length' candidates.json)
          echo "minting ${count} attestation bundle(s)"
          for i in $(seq 0 $((count - 1))); do
            ns=$(jq -r ".[$i].namespace" candidates.json)
            name=$(jq -r ".[$i].name" candidates.json)
            version=$(jq -r ".[$i].version" candidates.json)
            content_hash=$(jq -r ".[$i].content_hash" candidates.json)
            pin=$(python3 scripts/mint_bundle.py \
              --tianguis-bin ./tianguis \
              --attestation-dir attestation \
              --namespace "$ns" \
              --name "$name" \
              --version "$version" \
              --content-hash "$content_hash" \
              --attestation-kind "milpa-vendored" \
              --signed-by "https://github.com/coreyleavitt/tianguis (milpa-bot via GH OIDC)")
              # NOTE: this string must match `MilpaBotIdentity` in
              # src/tianguis/vendor/merge.nim (`Version.signedBy` for every
              # milpa-vendored entry). It is NOT cross-checked by milpa's
              # verifier — the statement's `predicate.signed_by` is metadata
              # only (RFC §6: predicate contents are never inspected) — so a
              # drift here is cosmetic, not a security bug, but keep it in
              # sync for consistency between the index entry and the bundle.
            jq --argjson entry "$(jq ".[$i]" candidates.json)" --arg pin "$pin" \
              '. + [$entry + {bundle_pin: $pin}]' pins.json > pins.json.tmp
            mv pins.json.tmp pins.json
          done

      - name: Apply minted bundle pins
        if: hashFiles('candidates.json') != ''
        run: ./tianguis vendor --bundle-pins=pins.json
      # --------------------------------------------------------------------

      - name: Keep index.json in parity
        run: ./tianguis project

      - name: Commit + push changes
        id: commit
        run: |
          # Stage each file separately so a missing alerts.kdl (no drift
          # this pass) doesn't make the whole `git add` no-op the others.
          git add index.kdl index.json
          [ -f alerts.kdl ] && git add alerts.kdl || true
          # Newly minted attestation bundles (S7b) — the content-addressed
          # tree milpa fetches `<hex>.bundle` files from at serve time
          # (bundlestore.nim's `writeBundle`). Absent when no post-epoch
          # entries needed minting this pass.
          [ -d attestation ] && git add attestation/ || true
          # Decide "no changes" from the STAGED index/alerts/attestation only —
          # NOT `git status --porcelain`, which also sees `milpa fetch`'s
          # milpa.lock re-lock churn and untracked build outputs, so a
          # zero-change vendor day would pass that guard then fail on an empty
          # `git commit`.
          if git diff --cached --quiet; then
            echo "no changes from this vendor pass"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "milpa-bot"
          git config user.email "milpa-bot@users.noreply.github.com"
          git commit -m "chore(vendor): daily milpa-bot vendoring pass"
          # A vendor pass can take >1h, during which other commits may
          # have landed on main. Rebase before push so we don't lose the
          # work. Retry a few times in case of rapid contention.
          # --autostash: `milpa fetch` re-locks tianguis's milpa.lock and leaves it
          # dirty, which would otherwise abort the rebase with "unstaged changes".
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true; break
            fi
            echo "push attempt $i failed; will retry"
            sleep $((i * 2))
          done
          if [[ "$pushed" != true ]]; then
            echo "::error::vendor push failed after 3 attempts"; exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Attest the vendor pass to Rekor under milpa-bot's GH Actions OIDC
      # identity. The signed blob is the post-vendor index.kdl; the
      # predicate names this workflow run + the commit it produced. Third
      # parties can correlate Rekor entries against tianguis git history
      # to detect index entries that no workflow run actually produced.
      - name: Cosign attest vendor pass
        if: steps.commit.outputs.changed == 'true'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cat > predicate.json <<EOF
          {
            "pass_kind": "vendor",
            "tianguis_repo": "${{ github.repository }}",
            "workflow_run": "${{ github.run_id }}",
            "commit_sha": "${COMMIT_SHA}",
            "vendored_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cosign attest-blob \
            --yes \
            --type custom \
            --predicate predicate.json \
            --bundle vendor-attest.bundle \
            index.kdl
          echo "Rekor bundle written to vendor-attest.bundle"
