name: dispatch-deploy

on:
  push:
    branches: [main]
    paths:
      - "dispatch/**"
      - ".github/workflows/dispatch-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # go.sum lives in the dispatch/ subdirectory, not at repo root.
          # Without this, setup-go's module cache silently disables itself.
          cache-dependency-path: dispatch/go.sum
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      NAMESPACE_ID: ${{ vars.SCW_FUNCTIONS_NAMESPACE_ID }}
      FUNCTION_NAME: dispatch
    steps:
      - uses: actions/checkout@v7

      - name: Install scw CLI
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/scaleway/scaleway-cli/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL -o scw "https://github.com/scaleway/scaleway-cli/releases/download/v${version}/scaleway-cli_${version}_linux_amd64"
          chmod +x scw
          sudo mv scw /usr/local/bin/
          scw version

      - name: Find or create function
        id: function
        run: |
          set -euo pipefail

          # Check if a function with our name already exists in the namespace.
          existing=$(scw function function list namespace-id=${NAMESPACE_ID} -o json \
            | jq -r --arg name "$FUNCTION_NAME" '.[] | select(.name == $name) | .id' \
            | head -n1)

          if [[ -z "$existing" ]]; then
            echo "Creating new function $FUNCTION_NAME"
            id=$(scw function function create namespace-id=${NAMESPACE_ID} \
              name=${FUNCTION_NAME} \
              runtime=go124 \
              handler=Handle \
              memory-limit=256 \
              min-scale=0 \
              max-scale=3 \
              timeout=30s \
              privacy=public \
              http-option=enabled \
              -o json | jq -r '.id')
          else
            echo "Reusing existing function $existing"
            id="$existing"
          fi
          echo "function_id=$id" >> "$GITHUB_OUTPUT"

      - name: Package + deploy function
        run: |
          set -euo pipefail
          fn=${{ steps.function.outputs.function_id }}

          # Zip the function source. Exclude tests (Scaleway doesn't strip
          # them and they pull go-jose deps not needed at runtime), the
          # local-dev cmd binary (package main, would conflict with
          # Scaleway's generated wrapper), and CI / git metadata.
          zip -r /tmp/dispatch.zip . \
            -x '*_test.go' \
            -x '.git/*' \
            -x '.github/*' \
            -x 'cmd/*'

          # Scaleway upload protocol: request a presigned S3 URL sized to
          # the exact zip byte length, PUT the zip, then trigger deploy.
          size=$(stat -c '%s' /tmp/dispatch.zip)
          upload_url=$(scw function function get-upload-url \
            function-id=$fn content-length=$size -o json | jq -r .url)

          # The presigned URL signs Content-Type + Content-Length + Host;
          # all three must be sent verbatim or S3 returns 403. -T provides
          # content-length from file size; we set content-type explicitly.
          curl -fsSL -X PUT -T /tmp/dispatch.zip \
            -H "Content-Type: application/octet-stream" \
            "$upload_url"

          scw function function deploy function-id=$fn

      - name: Print endpoint URL
        run: |
          scw function function get ${{ steps.function.outputs.function_id }} \
            -o json | jq -r '.domain_name' \
            | awk '{print "Dispatch endpoint: https://" $0}'

      # Provision the keepalive cron trigger. It POSTs {"secret": …} to the
      # function root on a ~14-day cadence; the keepalive handler validates the
      # secret and re-enables the schedule-triggered workflow(s) so GitHub's
      # 60-day inactivity auto-disable can't permanently stop the vendor cron.
      # The trigger lives on Scaleway's clock (independent of GitHub), so it
      # RECOVERS an already-disabled cron, not merely prevents disabling.
      #
      # The matching TIANGUIS_KEEPALIVE_SECRET must also be set as a function
      # secret in the Scaleway console (additive — the CLI's full-list replace
      # would clobber the unreadable App key, so the function-side secret is set
      # there, the same way the App key was). When the GitHub secret is unset
      # this step is a no-op, so the function deploy never depends on it.
      - name: Ensure keepalive cron trigger
        env:
          KEEPALIVE_SECRET: ${{ secrets.TIANGUIS_KEEPALIVE_SECRET }}
          FUNCTION_ID: ${{ steps.function.outputs.function_id }}
        run: |
          set -euo pipefail
          if [[ -z "${KEEPALIVE_SECRET}" ]]; then
            echo "TIANGUIS_KEEPALIVE_SECRET unset — skipping keepalive cron provisioning"
            exit 0
          fi

          # `scw function deploy` is async; the function is in a blocking state
          # (pending/deploying) for a bit afterward and rejects cron mutations.
          # Wait for it to settle to `ready` before provisioning the cron.
          echo "Waiting for function to be ready..."
          for _ in $(seq 1 60); do
            status=$(scw function function get "$FUNCTION_ID" -o json | jq -r '.status')
            echo "  status=$status"
            [[ "$status" == "ready" ]] && break
            [[ "$status" == "error" ]] && { echo "function in error state"; exit 1; }
            sleep 10
          done
          if [[ "$status" != "ready" ]]; then
            echo "function did not reach ready state in time"; exit 1
          fi

          # jq --arg JSON-escapes the secret into the cron body safely.
          args=$(jq -nc --arg s "$KEEPALIVE_SECRET" '{secret:$s}')
          schedule="0 8 1,15 * *"   # 08:00 UTC, 1st & 15th — 4 beats / 60-day window

          existing=$(scw function cron list function-id="$FUNCTION_ID" -o json \
            | jq -r '.[0].id // empty')
          if [[ -z "$existing" ]]; then
            echo "Creating keepalive cron"
            scw function cron create function-id="$FUNCTION_ID" \
              name=keepalive schedule="$schedule" args="$args"
          else
            echo "Updating keepalive cron $existing"
            scw function cron update "$existing" schedule="$schedule" args="$args"
          fi
