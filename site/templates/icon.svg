<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    tianguis icon — three peaked tarps in a row, pixel-art style.
    Color palette matches the site's terracotta accent.
    Pure rects (no diagonals) to keep the pixel-art aesthetic at any zoom.
  -->

  <!-- tarp body (3 peaked tents, sharing edges) -->
  <!-- peaks at cols 2, 8, 13 -->
  <!-- row 1: peak tips -->
  <rect x="2"  y="1" width="1" height="1" fill="#d9622e"/>
  <rect x="8"  y="1" width="1" height="1" fill="#d9622e"/>
  <rect x="13" y="1" width="1" height="1" fill="#d9622e"/>
  <!-- row 2: tarp slope down -->
  <rect x="1"  y="2" width="3" height="1" fill="#d9622e"/>
  <rect x="7"  y="2" width="3" height="1" fill="#d9622e"/>
  <rect x="12" y="2" width="3" height="1" fill="#d9622e"/>
  <!-- row 3: tarps merge/overlap -->
  <rect x="0"  y="3" width="11" height="1" fill="#d9622e"/>
  <rect x="11" y="3" width="5"  height="1" fill="#d9622e"/>
  <!-- row 4: full tarp -->
  <rect x="0"  y="4" width="16" height="1" fill="#d9622e"/>
  <!-- row 5: eaves (darker red — drop-shadow stripe) -->
  <rect x="0"  y="5" width="16" height="1" fill="#a04518"/>

  <!-- 4 poles holding the tarps up -->
  <rect x="1"  y="6" width="1" height="7" fill="#4a3525"/>
  <rect x="6"  y="6" width="1" height="7" fill="#4a3525"/>
  <rect x="10" y="6" width="1" height="7" fill="#4a3525"/>
  <rect x="14" y="6" width="1" height="7" fill="#4a3525"/>

  <!-- hint of goods underneath: woven baskets (yellow + green) -->
  <rect x="2"  y="9" width="4" height="3" fill="#e8c547"/>
  <rect x="11" y="9" width="3" height="3" fill="#7a9b3e"/>
  <!-- basket weave hint (single darker pixel row per basket) -->
  <rect x="2"  y="10" width="4" height="1" fill="#b8a035"/>
  <rect x="11" y="10" width="3" height="1" fill="#5a7530"/>

  <!-- ground line (subtle) -->
  <rect x="0"  y="13" width="16" height="1" fill="#4a3525"/>
</svg>
