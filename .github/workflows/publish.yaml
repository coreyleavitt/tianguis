name: tianguis-publish

# RETIRED (rfc-distribution-and-publishing, milpa Phase 3 — `milpa publish`
# revival). This reusable workflow is kept ONLY so existing `uses:
# coreyleavitt/tianguis/.github/workflows/publish.yaml@...` references in
# author repos fail with a clear message instead of a hard parse error.
#
# Two independent reasons this is retired, not just updated:
#
#   1. It called the OLD `milpa publish` monolith's flags (`--registry
#      --provider --repo-url --signed-by --dispatch-url`), which are DELETED
#      as of the revived, generic `milpa publish` CLI (`--version --target
#      --name --tag --output --dry-run --allow-untagged` only).
#   2. As a REUSABLE WORKFLOW (`workflow_call`), it runs as its OWN job, so
#      GitHub stamps its ambient OIDC token's `job_workflow_ref` (what
#      Fulcio puts in the cosign cert's SAN) with THIS workflow's own path —
#      not the calling author repo's. Every author who published through it
#      therefore signed under the SAME shared identity, collapsing
#      per-author accountability to zero (see
#      `.github/actions/publish/action.yaml`'s header comment for the full
#      explanation). This is a structural property of `workflow_call`, not
#      a bug fixable in place.
#
# Authors MUST switch to the composite action instead — it runs INSIDE the
# calling job, so the signing identity is genuinely per-author:
#
#   permissions:
#     id-token: write
#     contents: read
#     packages: write
#   steps:
#     - uses: actions/checkout@v6
#     - uses: coreyleavitt/tianguis/.github/actions/publish@main
#       with:
#         name: my-package
#         version: ${{ github.ref_name }}
#
# See docs/adoption/github.md for the full copy-paste and
# docs/rfc-attestation-delivery.handoff.md / rfc-distribution-and-publishing
# for the design rationale.

on:
  workflow_call:
    inputs:
      name:
        required: false
        type: string
      version:
        required: false
        type: string
      registry:
        required: false
        type: string
        default: ""
      dispatch-url:
        required: false
        type: string
        default: ""
      dry-run:
        required: false
        type: boolean
        default: false
    secrets:
      milpa-install-token:
        required: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Fail with a migration notice
        run: |
          echo "::error::coreyleavitt/tianguis/.github/workflows/publish.yaml is RETIRED. It called milpa publish's old monolith flags (deleted) and, as a reusable workflow, collapsed every author's cosign signing identity to the same shared SAN. Switch to the composite action instead: 'uses: coreyleavitt/tianguis/.github/actions/publish@<ref>' as a step in your OWN job (not a reusable-workflow 'uses:' at the jobs: level). See docs/adoption/github.md for the full copy-paste."
          exit 1
