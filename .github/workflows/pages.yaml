name: pages

# Rebuilds + deploys https://tianguis.dev on every commit to main that
# touches the index or the site templates. Pure-static; pages content
# is generated by site/scripts/build.py from index.json.

on:
  push:
    branches: [main]
    paths:
      - index.kdl
      - index.json
      - site/**
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue concurrent deploys — coalesce to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No cosign at build time: the durable Rekor pointer is recorded in the
      # index at publish (the `rekor` block), so the site reads a field instead
      # of re-verifying. This is the root-cause fix for the vanishing-link bug.

      - name: Install build deps
        run: pip install -r site/scripts/requirements.txt

      - name: Build site
        run: python3 site/scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
