name: "tianguis: build per-entry attestation bundle"
description: >-
  Compute an author-signed §1 in-toto statement (content_hash + tianguis
  purl) for one package version, sign it under the CALLING workflow's own
  ambient GitHub Actions OIDC identity, and emit the resulting Sigstore
  bundle (base64) for the author's own dispatch POST to carry.

# rfc-attestation-delivery.handoff.md S8 (tianguis#42) — the author-side
# half of per-entry attestation delivery. See docs/rfc-attestation-
# delivery.handoff.md's "RESOLVED: bundle-minting recipe" + "SHARPENED"
# sections for the full design rationale; short version below.
#
# WHY A COMPOSITE ACTION, NOT A REUSABLE WORKFLOW (`workflow_call`):
# a reusable workflow (like the existing tianguis-publish reusable
# workflow at .github/workflows/publish.yaml) runs as its OWN job, and
# GitHub stamps its ambient OIDC token's `job_workflow_ref` (what Fulcio
# puts in the signing cert's SAN) with the REUSABLE WORKFLOW's own path —
# NOT the calling repo's. publish.yaml's own "Compute registry ref +
# signer identity" step documents this exact behavior and works around it
# for the OCI-artifact signature by decoding the OIDC token's claim by
# hand. For per-entry attestation, that behavior is disqualifying: milpa's
# stage-6 "author-signed" gate needs the statement's signer to be the
# INDIVIDUAL AUTHOR's own identity (so a malicious/compromised author
# can be told apart from tianguis's own shared infra) — signing under a
# shared reusable-workflow identity would make every "author-signed" entry
# indistinguishable from a vendor-bot entry in every way that matters. A
# COMPOSITE ACTION (`uses: .../actions/x@ref` under a `steps:` list,
# not `jobs:`) runs INSIDE the caller's own job — so its ambient
# `id-token: write` OIDC request correctly reflects the CALLING repo's own
# `job_workflow_ref`, giving a genuinely per-author signing identity. This
# is the reason this is a NEW composite action rather than an extension of
# publish.yaml.
#
# SCOPE: this action does ONLY the new S8 work (content_hash, statement,
# sign, base64) — it does NOT push the OCI artifact, does NOT cosign-sign
# the OCI artifact, and does NOT POST to the dispatch endpoint. Those steps
# are the author's EXISTING publish pipeline (today: publish.yaml's
# reusable workflow, once `milpa publish` ships; today it's often
# hand-rolled per docs/adoption/github.md). This action hands back
# `entry-bundle-b64` as an output; the caller's own dispatch POST is
# responsible for including it as the `entry_bundle_b64` field
# (dispatch/handler.go's `PublishRequest.EntryBundleB64`) ALONGSIDE the
# name/version/oci_ref/upstream/signed_by fields it already sends. Kept
# separate deliberately — duplicating the OCI-push/cosign-sign pipeline
# here would create a second, divergent author onboarding path.
#
# REQUIRED PERMISSIONS in the calling job:
#   permissions:
#     id-token: write   # ambient OIDC for BOTH milpa's git clone (none
#                        # needed) and sigstore-python's sign_dsse — this
#                        # is what makes the signing identity the CALLING
#                        # repo's own workflow, not tianguis's.
#     contents: read     # the calling job must already have checked out
#                        # its own source tree (`actions/checkout`) BEFORE
#                        # this action runs — the `source-path` input
#                        # points into that checkout.

inputs:
  source-path:
    description: >-
      Path (relative to the calling workflow's own checkout) to the exact
      source tree that was (or will be) packed into the OCI artifact for
      this publish. content_hash is computed over these exact bytes —
      milpa's local-fetcher and OCI-fetcher identity algorithms must agree
      on the same tree for the statement's digest to bind to what tianguis
      later recomputes from the pulled artifact.
    required: true
  name:
    description: "Package name (must match milpa.kdl / the dispatch request's `name`)."
    required: true
  version:
    description: >-
      The version tag being published (e.g. "v1.2.3" or "1.2.3" — either
      form accepted; normalized identically to `tianguis add-entry`'s
      `normalizeVersion`, i.e. a leading "v" followed by a digit is
      stripped).
    required: true
  milpa-ref:
    description: >-
      Pinned milpa commit SHA to build `milpa hash` from. MUST track
      .github/workflows/commit-entry.yaml's own milpa pin in lockstep — a
      mismatch risks the author-side and tianguis-side identity algorithms
      disagreeing, which would always fail the S8 digest-binding check.
    required: false
    default: "130ecd1ed8328fe4b91e35314c7031ed9e72f781"
  milpa-git-read-pat:
    description: >-
      Fine-grained PAT with read access to coreyleavitt/milpa (temporary,
      while milpa is private — same secret publish.yaml's
      `milpa-install-token` documents). Omit once milpa is public.
    required: false
    default: ""

outputs:
  entry-bundle-b64:
    description: >-
      The signed Sigstore Bundle (BUNDLE_0_3 JSON), base64-encoded with no
      embedded newlines. Attach this as the `entry_bundle_b64` field on the
      dispatch POST to https://dispatch.tianguis.dev/v1/publish.
    value: ${{ steps.mint.outputs.entry-bundle-b64 }}
  content-hash:
    description: "The recomputed content_hash (dag-sha256:<hex>) — reuse it rather than recomputing."
    value: ${{ steps.mint.outputs.content-hash }}
  namespace:
    description: "The derived namespace (host/org) — reuse it rather than recomputing."
    value: ${{ steps.mint.outputs.namespace }}

runs:
  using: "composite"
  steps:
    - name: Configure git auth for private milpa read (temporary)
      if: inputs.milpa-git-read-pat != ''
      shell: bash
      env:
        PAT: ${{ inputs.milpa-git-read-pat }}
      run: |
        git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"

    - name: Set up Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: "2.2.0"

    - name: Set up uv (for milpa)
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Clone milpa (pinned — must track commit-entry.yaml's pin)
      shell: bash
      env:
        MILPA_SHA: ${{ inputs.milpa-ref }}
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/coreyleavitt/milpa.git "${RUNNER_TEMP}/milpa-tool"
        git -C "${RUNNER_TEMP}/milpa-tool" checkout "$MILPA_SHA"
        echo "MILPA_TOOL=${RUNNER_TEMP}/milpa-tool" >> "$GITHUB_ENV"

    - name: Build tianguis CLI (from this action's own pinned checkout)
      shell: bash
      # ${{ github.action_path }} is THIS action's own repo checkout
      # (tianguis, at the ref the caller pinned via `uses:
      # coreyleavitt/tianguis/.github/actions/publish@<ref>`) — a separate
      # checkout GitHub manages, distinct from the caller's own workspace
      # (which `source-path` points into). `.github/actions/publish` is two
      # directories below the repo root.
      run: |
        TIANGUIS_ROOT="$(cd "${{ github.action_path }}/../.." && pwd)"
        echo "TIANGUIS_ROOT=${TIANGUIS_ROOT}" >> "$GITHUB_ENV"
        nim c -d:release -d:ssl -o:"${RUNNER_TEMP}/tianguis" "${TIANGUIS_ROOT}/src/tianguis_cli.nim"

    - name: Set up Python (for sigstore signing)
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install sigstore
      shell: bash
      run: pip install -r "${TIANGUIS_ROOT}/scripts/requirements.txt"

    - name: Compute content_hash, build + sign the §1 statement
      id: mint
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
        PKG_NAME:    ${{ inputs.name }}
        PKG_VERSION: ${{ inputs.version }}
        # The calling repo's OWN workflow identity — correct here (unlike
        # a reusable workflow) precisely because this step runs inside the
        # caller's own job. THIS is the Model-3 trust anchor (rfc-
        # attestation-delivery.handoff.md S8 Layer 2c): it becomes both the
        # statement's `signed_by` predicate field AND — via `tianguis
        # derive-namespace` below — the namespace the statement's purl
        # binds to. It MUST be the exact string commit-entry.yaml's
        # verify_entry_bundle.py extracts from this bundle's own signing
        # certificate at admission time (Fulcio stamps the cert SAN from
        # this same ambient OIDC token), which is why this action derives
        # the namespace from THIS value and never from an upstream/OCI repo
        # URL (a URL-derived namespace could silently diverge from the
        # signer's real identity — e.g. a fork, a renamed org, or a repo
        # whose upstream URL doesn't match its own GH Actions path).
        SIGNED_BY: "https://github.com/${{ github.workflow_ref }}"
      run: |
        set -euo pipefail
        TIANGUIS_BIN="${RUNNER_TEMP}/tianguis"
        export PATH="${RUNNER_TEMP}:${PATH}"

        # milpa hash: content identity over the EXACT tree that gets/got
        # OCI-packed — no CAS admission, no lockfile writes (A0-cmd).
        # `uv run` syncs the project's venv on first use — no separate
        # `uv sync` step, matching commit-entry.yaml's own convention.
        CONTENT_HASH=$(uv run --project "${MILPA_TOOL}/impls/python" \
          python -m milpa hash "local=${SOURCE_PATH}")

        # Derive namespace from THIS action's own SIGNED_BY (the author's
        # per-repo job identity) via the Layer 2a single-source-of-truth
        # CLI — the SAME derivation `add-entry` runs server-side against
        # the cryptographically-verified SAN extracted from this exact
        # bundle. Client and server MUST agree byte-for-byte here, or the
        # §1 subject-name binding check rejects every publish (see this
        # action's header comment + rfc-attestation-delivery.handoff.md).
        # Deliberately NOT derived from an upstream/OCI repo URL — that can
        # diverge from the signer's real identity.
        NAMESPACE=$("$TIANGUIS_BIN" derive-namespace --signed-by="$SIGNED_BY")
        if [[ -z "$NAMESPACE" ]]; then
          echo "::error::could not derive namespace from signed-by=${SIGNED_BY}"
          exit 1
        fi

        # Normalize the version identically to addentry.nim's
        # normalizeVersion: a leading 'v' followed by a digit is stripped.
        # MUST mirror that proc exactly — see its doc comment.
        VERSION="$PKG_VERSION"
        if [[ "$VERSION" =~ ^v[0-9] ]]; then
          VERSION="${VERSION#v}"
        fi

        # Single source of truth for the statement bytes — never
        # re-derive the JSON shape here.
        "$TIANGUIS_BIN" attest-statement \
          --namespace="$NAMESPACE" \
          --name="$PKG_NAME" \
          --version="$VERSION" \
          --content-hash="$CONTENT_HASH" \
          --attestation-kind="author-signed" \
          --signed-by="$SIGNED_BY" \
          > statement.json

        # Sign under THIS job's ambient OIDC identity (requires
        # `id-token: write` in the calling job — documented above).
        python3 "${TIANGUIS_ROOT}/scripts/sign_statement.py" \
          < statement.json > bundle.json

        BUNDLE_B64=$(base64 -w0 bundle.json)

        {
          printf '%s<<%s\n%s\n%s\n' "entry-bundle-b64" "EOF_BUNDLE" "$BUNDLE_B64" "EOF_BUNDLE"
          echo "content-hash=${CONTENT_HASH}"
          echo "namespace=${NAMESPACE}"
        } >> "$GITHUB_OUTPUT"
