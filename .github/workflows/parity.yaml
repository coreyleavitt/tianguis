name: parity

on:
  push:
    branches: [main]
    paths:
      - "index.kdl"
      - "index.json"
      - "src/**"
      - "tests/**"
      - "milpa.kdl"
      - "milpa.lock"
      - ".github/workflows/parity.yaml"
  pull_request:
    paths:
      - "index.kdl"
      - "index.json"
      - "src/**"
      - "tests/**"
      - "milpa.kdl"
      - "milpa.lock"
      - ".github/workflows/parity.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # milpa is private; checkout via ssh-key deploy key (read-only,
      # scoped to coreyleavitt/milpa via the tianguis-read deploy key).
      - name: Check out milpa
        uses: actions/checkout@v4
        with:
          repository: coreyleavitt/milpa
          ssh-key: ${{ secrets.MILPA_READ_DEPLOY_KEY }}
          path: ../milpa-checkout

      - name: Move milpa to expected sibling path
        run: mv ../milpa-checkout ../milpa

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install milpa deps
        working-directory: ../milpa
        run: uv sync

      - name: Fetch deps via milpa
        run: uv run --project ../milpa python -m milpa fetch

      - name: Run unit tests
        run: |
          for f in tests/test_*.nim; do
            echo "::group::$f"
            nim c -r --hints:off "$f"
            echo "::endgroup::"
          done

      - name: Assert index.kdl / index.json parity
        run: |
          nim c -d:release -o:tianguis src/tianguis_cli.nim
          ./tianguis project --check
