name: parity

on:
  push:
    branches: [main]
    paths:
      - "index.kdl"
      - "index.json"
      - "src/**"
      - "tests/**"
      - "milpa.kdl"
      - "milpa.lock"
      - ".github/workflows/parity.yaml"
  pull_request:
    paths:
      - "index.kdl"
      - "index.json"
      - "src/**"
      - "tests/**"
      - "milpa.kdl"
      - "milpa.lock"
      - ".github/workflows/parity.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Load read deploy keys for both private repos we'll touch:
      #  - milpa: this workflow's tooling
      #  - nimkdl: pulled transitively by milpa fetch
      # ssh-agent persists across subsequent steps, so milpa's own git
      # clones (run from `python -m milpa fetch`) pick the keys up too.
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.MILPA_READ_DEPLOY_KEY }}
            ${{ secrets.NIMKDL_READ_DEPLOY_KEY }}

      - name: Check out milpa
        uses: actions/checkout@v4
        with:
          repository: coreyleavitt/milpa
          ref: main              # explicit ref skips the default-branch REST API
                                 # call, which would use GITHUB_TOKEN (no scope
                                 # for the private milpa repo) and fail
          path: .milpa-tool

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install milpa deps
        working-directory: .milpa-tool
        run: uv sync

      - name: Fetch deps via milpa
        run: uv run --project .milpa-tool python -m milpa fetch

      - name: Run unit tests
        run: |
          for f in tests/test_*.nim; do
            echo "::group::$f"
            nim c -r --hints:off "$f"
            echo "::endgroup::"
          done

      - name: Assert index.kdl / index.json parity
        run: |
          nim c -d:release -o:tianguis src/tianguis_cli.nim
          ./tianguis project --check
