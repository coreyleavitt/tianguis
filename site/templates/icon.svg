<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    tianguis icon — flat tarp stretched across 4 poles, 3 stalls of
    produce underneath. pixel-art style, pure rects, no diagonals.
    palette matches the site's terracotta accent.

    layout (16x16):
      poles at cols 0, 5, 10, 15  → 3 stalls at cols 1-4, 6-9, 11-14
      tarp rows 1-3, ground row 11
  -->

  <!-- tarp body (flat horizontal canvas, extends just past poles) -->
  <rect x="0" y="1" width="16" height="2" fill="#d9622e"/>
  <!-- tarp eaves shadow (drop-line under the tarp) -->
  <rect x="0" y="3" width="16" height="1" fill="#a04518"/>

  <!-- 4 poles (dark wood) -->
  <rect x="0"  y="4" width="1" height="7" fill="#4a3525"/>
  <rect x="5"  y="4" width="1" height="7" fill="#4a3525"/>
  <rect x="10" y="4" width="1" height="7" fill="#4a3525"/>
  <rect x="15" y="4" width="1" height="7" fill="#4a3525"/>

  <!-- stall 1: green produce (nopales / chiles / cilantro) -->
  <rect x="1" y="7"  width="4" height="3" fill="#7a9b3e"/>
  <rect x="1" y="10" width="4" height="1" fill="#5a7530"/>

  <!-- stall 2: yellow produce (mango / maíz / papaya) -->
  <rect x="6" y="7"  width="4" height="3" fill="#e8c547"/>
  <rect x="6" y="10" width="4" height="1" fill="#b8a035"/>

  <!-- stall 3: red produce (tomate / jamaica / fresa) -->
  <rect x="11" y="7"  width="4" height="3" fill="#c93838"/>
  <rect x="11" y="10" width="4" height="1" fill="#992828"/>

  <!-- ground line -->
  <rect x="0" y="11" width="16" height="1" fill="#4a3525"/>
</svg>
