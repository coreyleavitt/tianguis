name: vendor

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: write          # to commit + push updated index.kdl / alerts.kdl
  id-token: write          # cosign keyless: attest the vendor pass under workflow identity

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Rewrite every github.com URL form to authenticated https using a
      # fine-grained PAT scoped to milpa + nimkdl read-only. This applies
      # globally for this job, so both this step's explicit clone of milpa
      # AND milpa's subprocess clones (which fetch nimkdl) inherit auth
      # transparently — no per-clone token interpolation, no ssh-agent.
      - name: Configure git auth for private deps
        env:
          PAT: ${{ secrets.TIANGUIS_GIT_READ_PAT }}
        run: |
          # insteadOf is multi-valued; --add to avoid overwriting previous.
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Clone milpa
        run: git clone --depth 1 https://github.com/coreyleavitt/milpa.git .milpa-tool

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install milpa deps
        working-directory: .milpa-tool
        run: uv sync

      - name: Fetch deps via milpa
        run: uv run --project .milpa-tool python -m milpa fetch

      - name: Build tianguis CLI
        run: nim c -d:release -o:tianguis src/tianguis_cli.nim

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Run vendor pass
        run: ./tianguis vendor

      - name: Keep index.json in parity
        run: ./tianguis project

      - name: Commit + push changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "no changes from this vendor pass"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "milpa-bot"
          git config user.email "milpa-bot@users.noreply.github.com"
          git add index.kdl index.json alerts.kdl 2>/dev/null || true
          git commit -m "chore(vendor): daily milpa-bot vendoring pass"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Attest the vendor pass to Rekor under milpa-bot's GH Actions OIDC
      # identity. The signed blob is the post-vendor index.kdl; the
      # predicate names this workflow run + the commit it produced. Third
      # parties can correlate Rekor entries against tianguis git history
      # to detect index entries that no workflow run actually produced.
      - name: Cosign attest vendor pass
        if: steps.commit.outputs.changed == 'true'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cat > predicate.json <<EOF
          {
            "pass_kind": "vendor",
            "tianguis_repo": "${{ github.repository }}",
            "workflow_run": "${{ github.run_id }}",
            "commit_sha": "${COMMIT_SHA}",
            "vendored_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cosign attest-blob \
            --yes \
            --type custom \
            --predicate predicate.json \
            --bundle vendor-attest.bundle \
            index.kdl
          echo "Rekor bundle written to vendor-attest.bundle"
