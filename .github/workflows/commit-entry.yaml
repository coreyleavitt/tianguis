name: commit-entry

# Triggered by the dispatch endpoint after it OIDC-verifies the publish
# request. Also supports manual workflow_dispatch for testing + recovery.
#
# This workflow IS the trust authority (see dispatch_security_architecture
# memory). Dispatch only does OIDC verify + identity cross-check; the
# actual cosign signature verification + Rekor attestation happens here,
# under a GH Actions OIDC identity that Sigstore's federation accepts.

on:
  repository_dispatch:
    types: [tianguis-publish]
  workflow_dispatch:
    inputs:
      name:
        description: "Package name"
        required: true
      version:
        description: "Semver-shaped version (v1.2.3 or 1.2.3)"
        required: true
      oci_ref:
        description: "<registry>/<repo>@sha256:<digest>"
        required: true
      upstream:
        description: "Upstream repo URL (https://...)"
        required: true
      source_url:
        description: >-
          SOURCE git repo this OCI artifact was published from (milpa
          publish's receipt `source_url`, forwarded by the dispatch
          handler). Optional — empty when the published repo has no
          `origin` remote configured; recorded as the oci provenance's
          `source` child (add-entry --source), no `source` node when empty.
        required: false
        default: ""
      signed_by:
        description: "Expected cosign signer identity regexp prefix (used in cosign verify)"
        required: true
      entry_bundle_b64:
        description: >-
          Author's per-entry Sigstore attestation bundle (base64), forwarded
          by the dispatch handler (S8/tianguis#42). Empty = no bundle
          (pre-S8/manual-recovery behavior). The workflow body already
          consumes github.event.inputs.entry_bundle_b64; this declaration was
          missing, so the author-dispatch trigger 422'd until the first real
          author publish surfaced it.
        required: false
        default: ""
      # NOTE: `namespace` input removed in P2.1 — the namespace is now derived
      # inside the binary from the verified OIDC SAN extracted in the cosign step.

permissions:
  contents: write   # commit the new entry to index.kdl + index.json
  id-token: write   # cosign keyless: fetch Fulcio cert under workflow OIDC identity

jobs:
  add-entry:
    runs-on: ubuntu-latest
    # Exposed so the attest-index job below can gate on "did this publish
    # actually commit+push a new index.kdl" (rfc-registry-trust-federation.md
    # §4/§7.3 — TNG-INDEX-BUNDLE-MISSING). `changed`/`sha` mirror the
    # "Commit + push if changed" step's own $GITHUB_OUTPUT values.
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha:     ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure git auth for private deps (milpa + nimkdl reads)
        env:
          PAT: ${{ secrets.TIANGUIS_GIT_READ_PAT }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Clone milpa (build tool — pinned)
        # Pinned to a fixed SHA, not floating main HEAD: the build tool must be
        # reproducible, and the pin MUST be >= the P1.2 commit (079dbf0) that
        # taught parse_index the (namespace,name) tuple key. The instant the #32
        # migrated (tuple-keyed) index.kdl lands on main, a pre-P1.2 milpa would
        # choke on it here. Bump deliberately, never below 079dbf0. (RFC
        # rfc-identity-and-resolution-completion §1 deploy-ordering gate.)
        #
        # Bumped to 27435c5 (rfc-distribution-and-publishing, milpa Phase 3 —
        # the revived, generic `milpa publish` CLI): this pin MUST track
        # .github/actions/publish/action.yaml's `milpa-ref` default in
        # lockstep — this workflow re-verifies the SAME content_hash the
        # author-side action computed at publish time (via `milpa publish`'s
        # identity algorithm), and a mismatched milpa version between the two
        # sides would always fail the §1 digest-binding check. Also note: the
        # OLD pin (130ecd1) predated impls/python/'s introduction, so it was
        # already stale — `uv run --project .milpa-tool/impls/python` below
        # would fail against anything that old.
        env:
          MILPA_SHA: 92d18abd0b55ab58c87f619556374f4bd58a2c22
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/coreyleavitt/milpa.git .milpa-tool
          git -C .milpa-tool checkout "$MILPA_SHA"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Set up uv (for milpa)
        uses: astral-sh/setup-uv@v7
        with:
          # Cache disabled: setup-uv's cache-dependency-glob recursively walks
          # the workspace (incl. the cloned .milpa-tool/), and milpa's
          # conformance corpus carries an intentional cyclic-symlink fixture
          # (fixture-309-ws-member-cyclic-symlink) that ELOOPs the walk. The
          # cache only saves seconds on milpa's small pydep set.
          enable-cache: false

      - name: Set up oras (OCI artifact pull)
        uses: oras-project/setup-oras@v2
        with:
          version: "1.2.0"

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Fetch deps via milpa
        run: uv run --project .milpa-tool/impls/python python -m milpa fetch

      - name: Expose milpa on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/milpa" <<'SH'
          #!/usr/bin/env bash
          exec uv run --project "$GITHUB_WORKSPACE/.milpa-tool/impls/python" python -m milpa "$@"
          SH
          chmod +x "$HOME/.local/bin/milpa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build tianguis CLI
        run: nim c -d:release -d:ssl -o:tianguis src/tianguis_cli.nim

      # Payload arrives via repository_dispatch (client_payload) or
      # workflow_dispatch (inputs). Normalize once.
      - name: Pick payload source
        id: payload
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            P='${{ toJson(github.event.client_payload) }}'
          else
            P='${{ toJson(github.event.inputs) }}'
          fi
          # NOTE: `namespace` removed from key list in P2.1 — no longer passed to add-entry.
          # M9 fix: use heredoc-delimiter form to prevent multiline values from
          # smuggling extra output keys via GITHUB_OUTPUT newline injection.
          #
          # entry_bundle_b64 (rfc-attestation-delivery S8, tianguis#42): the
          # author's per-entry attestation bundle (a Sigstore Bundle JSON
          # document, base64-encoded with NO embedded newlines — the
          # composite action base64's with `-w0`/single-line output) —
          # UNTRUSTED until the "Verify author entry-statement bundle" step
          # below cryptographically verifies it. Optional: empty for
          # manual workflow_dispatch recovery runs or pre-S8 callers; when
          # empty, add-entry runs with no --entry-statement/--bundle-pin
          # (unchanged pre-S8 behavior).
          for k in name version oci_ref upstream source_url signed_by entry_bundle_b64; do
            v=$(echo "$P" | jq -r --arg k "$k" '.[$k] // ""')
            # Reject values containing newlines before writing — a newline in a
            # payload field would corrupt the GITHUB_OUTPUT format regardless of
            # the heredoc guard below, since ${k}<<EOF_${k} itself must be a
            # single line.
            if [[ "$v" == *$'\n'* ]]; then
              echo "::error::payload field '${k}' contains a newline; rejecting"
              exit 1
            fi
            printf '%s<<%s\n%s\n%s\n' "$k" "EOF_${k}" "$v" "EOF_${k}" >> "$GITHUB_OUTPUT"
          done

      # The actual trust check: verify the author's cosign signature on
      # the OCI artifact. cosign verify checks Fulcio cert + Rekor
      # inclusion proof + that the cert identity matches what the dispatch
      # request claimed in signed_by. If any of those fail, the workflow
      # exits non-zero and nothing gets committed.
      #
      # P2.1 / MODEL 3 (rfc-attestation-delivery S8 Layer 2b, tianguis#42):
      # additionally extract the verified SAN from cosign's JSON output and
      # export it. This SAN identifies whoever signed the OCI ARTIFACT —
      # under Model 3 that's `publish.yaml`, a SHARED reusable workflow, so
      # this SAN is the SAME constant identity for every author (see the
      # handoff doc's "BOMBSHELL" finding). It therefore NO LONGER feeds
      # namespace derivation or `signed_by` when an author entry-bundle was
      # supplied — see the "Verify author entry-statement bundle" step
      # below, which extracts the true per-author SAN instead. This SAN
      # remains the fallback `signed_by` ONLY for pre-S8/manual-recovery
      # callers that supply no entry bundle at all (see the "Add entry"
      # step's `ARG_SIGNED_BY`), and continues to back the OCI-provenance
      # Rekor pointer + the commit-decision predicate below.
      - name: Verify author cosign signature
        id: cosign
        env:
          OCI_REF: ${{ steps.payload.outputs.oci_ref }}
          SIGNED_BY: ${{ steps.payload.outputs.signed_by }}
        run: |
          # The extracted SAN (from cosign's JSON output) is the AUTHORITATIVE
          # identity used by the Nim binary to derive the namespace. The
          # caller-supplied SIGNED_BY is used ONLY as a regexp prefix hint for
          # cosign verify here — it is NOT trusted as the authoritative identity.
          # H2 explanation: because the extracted SAN is authoritative, the
          # --certificate-identity-regexp using caller input is technically
          # defense-in-depth, not the trust anchor. The trust anchor is the
          # extracted SAN that goes into steps.cosign.outputs.san and is passed
          # to the binary as --signed-by. The caller can only narrow (not
          # broaden) the match; the cosign OIDC issuer pin does the actual trust.
          # The reusable publish workflow lives at a stable path; refs
          # vary (refs/heads/main, refs/tags/v1, SHAs). Match prefix.
          COSIGN_OUTPUT=$(cosign verify \
            --certificate-identity-regexp="^${SIGNED_BY}@" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --output json \
            "${OCI_REF}")

          SAN=$(echo "$COSIGN_OUTPUT" | jq -r '.[0].optional.Subject')

          # A missing/empty/null SAN means the jq path is wrong or cosign output
          # changed. Hard-fail here so a bad SAN cannot silently cause every
          # publish to be rejected by the binary's deriveNamespace guard.
          # H3 fix: also guard against jq -r yielding the literal string "null"
          # (happens when the jq path doesn't match — `jq -r` emits "null"
          # instead of empty for missing keys, which passes a bare -z guard).
          # jq paths verified 2026-06-08 against real cosign v2.4.0 --output json
          # on a genuine Fulcio cert + Rekor entry (nkdl v0.1.0,
          # ghcr.io/coreyleavitt/nkdl@sha256:01c9ee…): .[0].optional.Subject and
          # the Bundle.Payload paths below all resolved correctly.
          if [[ -z "$SAN" || "$SAN" == "null" ]]; then
            echo "::error::empty or null SAN from cosign verify --output json; check the jq path .[0].optional.Subject"
            exit 1
          fi

          # Durable Rekor pointer (root-cause fix for the vanishing site link):
          # capture the transparency-log entry coordinates ONCE here, at publish,
          # so the site renders a stable link from index.json instead of
          # re-running `cosign verify` at every build. logIndex + integratedTime
          # are in the same cosign Bundle.Payload we just verified; the UUID
          # (content-addressed, shard-independent — the most durable id) is the
          # top-level key of the Rekor entry, resolved by a best-effort lookup.
          REKOR_LOG_INDEX=$(echo "$COSIGN_OUTPUT" | jq -r '.[0].optional.Bundle.Payload.logIndex // empty')
          REKOR_INTEGRATED_TIME=$(echo "$COSIGN_OUTPUT" | jq -r '.[0].optional.Bundle.Payload.integratedTime // empty')
          REKOR_UUID=""
          if [[ -n "$REKOR_LOG_INDEX" ]]; then
            # The public-good Rekor instance keys entries by UUID; querying by
            # logIndex returns { "<uuid>": {…} }. Best-effort: a UUID-less entry
            # still records logIndex (the link falls back to ?logIndex=).
            REKOR_UUID=$(curl -sf "https://rekor.sigstore.dev/api/v1/log/entries?logIndex=${REKOR_LOG_INDEX}" \
              | jq -r 'keys[0] // empty' || true)
          fi
          # These values are numeric (logIndex, integratedTime) or hex (uuid) and
          # cannot contain newlines, so a plain key=value GITHUB_OUTPUT line is safe.
          {
            printf '%s<<%s\n%s\n%s\n' "san" "EOF_san" "$SAN" "EOF_san"
            echo "rekor_uuid=${REKOR_UUID}"
            echo "rekor_log_index=${REKOR_LOG_INDEX}"
            echo "rekor_integrated_time=${REKOR_INTEGRATED_TIME}"
          } >> "$GITHUB_OUTPUT"

      # rfc-attestation-delivery S8 Layer 2b (tianguis#42) — the author-signed
      # per-entry attestation bundle. This is DISTINCT from the OCI cosign
      # verification above: that step proves the author signed the OCI
      # ARTIFACT (bound to the OCI manifest digest, under the SHARED
      # publish.yaml identity); this step proves the author signed the §1
      # in-toto STATEMENT (bound to content_hash + the tianguis purl) that
      # milpa's per-entry verifier actually checks, under the AUTHOR'S OWN
      # per-repo identity (the publish composite action runs in the
      # author's own job, not a reusable workflow — see
      # `.github/actions/publish/action.yaml`'s header comment).
      #
      # THE MODEL-3 IDENTITY FLOW (rfc-attestation-delivery.handoff.md
      # "VERIFIED 2026-07-11 … Model 3 confirmed, scope widened"):
      #   - `Version.signedBy` / the registry's namespace MUST come from
      #     THIS bundle's cert SAN (the author's own per-repo identity),
      #     NEVER from `steps.cosign.outputs.san` (the shared OCI SAN).
      #   - The CLIENT (the publish composite action, part D) and the
      #     SERVER (add-entry, via `deriveNamespace`) must derive the exact
      #     same namespace from the exact same signed-by value, or the §1
      #     subject-name binding check rejects every publish — both sides
      #     now share the `tianguis derive-namespace` CLI (Layer 2a) as the
      #     single source of truth for that derivation.
      #   - Two verify modes (`scripts/verify_entry_bundle.py`): KNOWN-SAN
      #     when the target package already has a pinned
      #     `Package.authorizedSigner` (defense-in-depth — the S8 Layer 3
      #     Nim ratchet in `mergeVendored` is the authoritative enforcement
      #     regardless), or ISSUER-ONLY/TOFU for a brand-new package (first
      #     author-signed version pins the ratchet). Which mode runs is
      #     decided below from a namespace derived off the dispatch
      #     payload's `signed_by` field — an UNTRUSTED HINT used only to
      #     pick a verify mode / do an early pinned-signer lookup, exactly
      #     like the OCI step's caller-supplied `signed_by` above. Even if
      #     this hint is wrong or adversarial, the actual admitted identity
      #     always comes from the cryptographically verified/extracted SAN
      #     below, and `mergeVendored`'s Layer 3 ratchet independently
      #     re-checks it against whatever is really pinned — a bad hint can
      #     only cost this pre-check its defense-in-depth shortcut, never
      #     bypass the real guard.
      #
      # THE SECURITY INVARIANT: crypto here proves "the author identity
      # verified below signed THIS exact statement, and it reached a real
      # Rekor transparency-log entry." It does NOT prove the statement's
      # claimed subject (content_hash + purl) matches what tianguis is
      # about to admit — `tianguis add-entry --entry-statement` (Nim,
      # locally gate-able, S8 part A) does that half by recomputing
      # content_hash itself and rejecting on any mismatch. Skipped entirely
      # (ARG_ENTRY_STATEMENT/ARG_BUNDLE_PIN stay empty, ARG_SIGNED_BY falls
      # back to the OCI SAN) when no bundle was supplied in the payload —
      # add-entry's both-or-neither rule tolerates that (pre-S8 / manual-
      # recovery callers).
      - name: Set up Python (for sigstore bundle verification)
        if: steps.payload.outputs.entry_bundle_b64 != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install sigstore
        if: steps.payload.outputs.entry_bundle_b64 != ''
        run: pip install -r scripts/requirements.txt

      # Layer 2b pre-check: derive a CANDIDATE namespace from the untrusted
      # payload signed_by hint (via the Layer 2a `tianguis derive-namespace`
      # CLI — the SAME derivation add-entry uses server-side), then look up
      # whether that (namespace, name) package already has a pinned
      # `authorizedSigner` in the CURRENT (pre-this-publish) index.json.
      # Purely a mode-selector / fail-fast optimization — see the security
      # note above: a wrong candidate here degrades to TOFU mode, it never
      # weakens what actually gets admitted.
      - name: Look up pinned signer (Model 3 verify-mode selection)
        id: pinned_signer
        if: steps.payload.outputs.entry_bundle_b64 != ''
        env:
          SIGNED_BY_HINT: ${{ steps.payload.outputs.signed_by }}
          PKG_NAME:       ${{ steps.payload.outputs.name }}
        run: |
          CANDIDATE_NS=$(./tianguis derive-namespace --signed-by="$SIGNED_BY_HINT" || true)
          if [[ -z "$CANDIDATE_NS" ]]; then
            # Underivable hint — treat as "no pin found" (TOFU mode below);
            # add-entry's OWN --signed-by (from the real extracted SAN)
            # still has to derive successfully, independently, later.
            echo "pinned=" >> "$GITHUB_OUTPUT"
          else
            PINNED=$(jq -r --arg ns "$CANDIDATE_NS" --arg name "$PKG_NAME" \
              '.packages[]? | select(.namespace == $ns and .name == $name) | .authorized_signer // empty' \
              index.json)
            printf '%s<<%s\n%s\n%s\n' "pinned" "EOF_pinned" "$PINNED" "EOF_pinned" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify author entry-statement bundle
        id: entry_statement
        if: steps.payload.outputs.entry_bundle_b64 != ''
        env:
          ENTRY_BUNDLE_B64: ${{ steps.payload.outputs.entry_bundle_b64 }}
          PINNED_SIGNER:    ${{ steps.pinned_signer.outputs.pinned }}
        run: |
          # Decode first — the bundle is UNTRUSTED input until
          # verify_entry_bundle.py's cryptographic check passes below. Not
          # inlined into a heredoc/JSON: raw bytes only, base64-decoded via
          # an env var (never a GitHub-expression-interpolated shell string).
          echo "$ENTRY_BUNDLE_B64" | base64 -d > entry-bundle.json

          # KNOWN-SAN mode (pinned signer found above) or ISSUER-ONLY/TOFU
          # mode (new package) — see verify_entry_bundle.py's module
          # docstring. Either way: OIDC issuer == GitHub Actions' token
          # issuer, and Rekor transparency-log inclusion, checked against
          # Sigstore's production trusted root. On success, writes the
          # verified in-toto statement payload to entry-statement.json and
          # prints the verified/extracted author SAN to stdout — that SAN
          # (never the OCI cosign SAN) is the AUTHORITATIVE signed_by add-
          # entry records.
          if [[ -n "$PINNED_SIGNER" ]]; then
            AUTHOR_SAN=$(python3 scripts/verify_entry_bundle.py \
              --bundle entry-bundle.json \
              --certificate-identity "$PINNED_SIGNER" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --out entry-statement.json)
          else
            AUTHOR_SAN=$(python3 scripts/verify_entry_bundle.py \
              --bundle entry-bundle.json \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --out entry-statement.json)
          fi

          # Content-addressed bundle store (S4) — reuse mint_bundle.py's
          # write_bundle (same algorithm as bundlestore.nim's writeBundle:
          # sha256 of the bundle BYTES -> attestation/<hex>.bundle, flat
          # tree, idempotent, atomic temp+rename) rather than re-deriving
          # "hash + mkdir + write" a third time in shell.
          pin=$(python3 -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from mint_bundle import write_bundle
          data = Path('entry-bundle.json').read_bytes()
          print(write_bundle(Path('attestation'), data))
          ")
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          printf '%s<<%s\n%s\n%s\n' "author_san" "EOF_author_san" "$AUTHOR_SAN" "EOF_author_san" >> "$GITHUB_OUTPUT"

      - name: Add entry (pulls OCI + content_hash + merges index)
        # P2.1: --namespace removed; the binary derives it from --signed-by (the
        # verified cosign SAN extracted above). --signed-by is now the actual cert
        # SAN, not the caller-supplied regexp prefix used for cosign verify.
        env:
          # Route every interpolated value through env vars (same discipline as
          # the predicate step). GitHub expands `${{ }}` BEFORE the shell parses
          # the line, so an inline `--upstream="${{ ...upstream }}"` with a value
          # containing a `"` is argument injection into the binary (a crafted
          # upstream/oci_ref could smuggle extra `tianguis add-entry` flags).
          # As `"$ARG"` shell expansions, a `"` inside the value stays data, not
          # a quote delimiter, so each flag receives exactly one argument.
          ARG_NAME:      ${{ steps.payload.outputs.name }}
          ARG_VERSION:   ${{ steps.payload.outputs.version }}
          ARG_OCI_REF:   ${{ steps.payload.outputs.oci_ref }}
          ARG_UPSTREAM:  ${{ steps.payload.outputs.upstream }}
          # SOURCE git repo this OCI artifact was published from (milpa
          # publish's receipt source_url, pure passthrough — dispatch does
          # not validate it). Empty when the published repo had no `origin`
          # remote; add-entry --source="" records no `source` child.
          ARG_SOURCE_URL: ${{ steps.payload.outputs.source_url }}
          # MODEL 3 (rfc-attestation-delivery S8 Layer 2b): the per-entry
          # `signed_by` — and therefore the namespace add-entry derives from
          # it — comes from the author entry-bundle's OWN cryptographically
          # verified/extracted cert SAN (steps.entry_statement.outputs.
          # author_san), NEVER the shared OCI cosign SAN. The OCI SAN
          # (steps.cosign.outputs.san) is used ONLY as a fallback for pre-S8
          # / manual-recovery callers that supplied no entry bundle at all
          # (steps.entry_statement is then skipped entirely, so its output
          # is empty and this expression falls through).
          ARG_SIGNED_BY: ${{ steps.entry_statement.outputs.author_san != '' && steps.entry_statement.outputs.author_san || steps.cosign.outputs.san }}
          # Durable Rekor pointer captured in the cosign step. Empty values are
          # tolerated by the binary (an all-empty trio records no rekor block).
          ARG_REKOR_UUID:            ${{ steps.cosign.outputs.rekor_uuid }}
          ARG_REKOR_LOG_INDEX:       ${{ steps.cosign.outputs.rekor_log_index }}
          ARG_REKOR_INTEGRATED_TIME: ${{ steps.cosign.outputs.rekor_integrated_time }}
          # S8 — both empty together when no bundle was supplied (add-entry's
          # both-or-neither rule tolerates that); both set together when the
          # crypto step above verified one. Never set independently: the
          # pin and the statement path always come from the same step.
          ARG_BUNDLE_PIN:       ${{ steps.entry_statement.outputs.pin }}
          ARG_ENTRY_STATEMENT:  ${{ steps.entry_statement.outputs.pin != '' && 'entry-statement.json' || '' }}
        run: |
          # Build the argv as an array (each element is exactly one arg — the
          # same injection-safety discipline as the "$ARG" expansions above).
          add_args=(
            --name="$ARG_NAME"
            --version="$ARG_VERSION"
            --oci-ref="$ARG_OCI_REF"
            --upstream="$ARG_UPSTREAM"
            --signed-by="$ARG_SIGNED_BY"
            --rekor-uuid="$ARG_REKOR_UUID"
            --rekor-log-index="$ARG_REKOR_LOG_INDEX"
            --rekor-integrated-time="$ARG_REKOR_INTEGRATED_TIME"
            --bundle-pin="$ARG_BUNDLE_PIN"
            --entry-statement="$ARG_ENTRY_STATEMENT"
          )
          # Only pass --source when non-empty. An empty `--source=` makes Nim's
          # parseopt treat the value as "missing" and SWALLOW the next flag
          # (`--signed-by=…`) as its value — which zeroed out signed_by and
          # broke first-package onboarding. Omitting it records no `source`
          # child, exactly as an empty value was meant to. (tianguis_cli.nim's
          # parser is also hardened against this footgun as defense-in-depth.)
          [ -n "$ARG_SOURCE_URL" ] && add_args+=(--source="$ARG_SOURCE_URL")
          ./tianguis add-entry "${add_args[@]}"

      - name: Regenerate index.json
        run: ./tianguis project

      # Build a custom predicate describing this commit decision and attest
      # it to Rekor under the workflow's GH Actions OIDC identity. Third
      # parties can later compare what's in index.kdl against attested
      # decisions in Rekor to catch dispatch-only-side compromise.
      - name: Write attestation predicate
        id: predicate
        env:
          # Pull all interpolated values into env vars so jq --arg receives
          # them as safe shell variables, not as inline GitHub expression
          # expansions inside a JSON heredoc. A `"` in any of these values
          # would otherwise inject into the JSON and corrupt the Rekor
          # attestation (T2 fix).
          PRED_NAME:          ${{ steps.payload.outputs.name }}
          PRED_VERSION:       ${{ steps.payload.outputs.version }}
          PRED_OCI_REF:       ${{ steps.payload.outputs.oci_ref }}
          PRED_UPSTREAM:      ${{ steps.payload.outputs.upstream }}
          # H2 + T2: use the EXTRACTED SAN (verified cert identity), not the
          # caller-supplied signed_by regexp. The extracted SAN is what cosign
          # actually verified against the Fulcio cert + Rekor entry, and is
          # what index.kdl records. Using the caller input here would create
          # an audit trail mismatch between Rekor and index.kdl.
          PRED_SIGNED_BY:     ${{ steps.cosign.outputs.san }}
          PRED_TIANGUIS_REPO: ${{ github.repository }}
          PRED_WORKFLOW_RUN:  ${{ github.run_id }}
        run: |
          # jq --arg passes each value through its JSON string encoder, so
          # quotes, backslashes, newlines, and other control characters in any
          # field are properly escaped. No heredoc string interpolation.
          jq -n \
            --arg name          "$PRED_NAME" \
            --arg version       "$PRED_VERSION" \
            --arg oci_ref       "$PRED_OCI_REF" \
            --arg upstream      "$PRED_UPSTREAM" \
            --arg signed_by     "$PRED_SIGNED_BY" \
            --arg tianguis_repo "$PRED_TIANGUIS_REPO" \
            --arg workflow_run  "$PRED_WORKFLOW_RUN" \
            --arg verified_at   "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              name:          $name,
              version:       $version,
              oci_ref:       $oci_ref,
              upstream:      $upstream,
              signed_by:     $signed_by,
              tianguis_repo: $tianguis_repo,
              workflow_run:  $workflow_run,
              verified_at:   $verified_at
            }' > predicate.json
          echo "path=predicate.json" >> "$GITHUB_OUTPUT"

      - name: Cosign attest commit decision
        env:
          OCI_REF: ${{ steps.payload.outputs.oci_ref }}
        run: |
          # attest-blob (not `attest`) because the attestation lives in
          # Rekor only — `cosign attest` tries to write an OCI sidecar
          # alongside the author's artifact, which lives in a namespace
          # tianguis doesn't have push access to. Rekor is the actual
          # transparency layer we care about anyway.
          cosign attest-blob \
            --yes \
            --type custom \
            --predicate "${{ steps.predicate.outputs.path }}" \
            --bundle commit-attest.bundle \
            "${{ steps.predicate.outputs.path }}"
          echo "Rekor bundle written to commit-attest.bundle (subject=predicate.json; predicate names oci_ref=${OCI_REF})"

      - name: Commit + push if changed
        id: commit
        run: |
          git config user.name "tianguis-bot"
          git config user.email "tianguis-bot@users.noreply.github.com"
          git add index.kdl index.json
          # Newly persisted per-entry attestation bundle (S4/S8) — the
          # content-addressed tree milpa fetches <hex>.bundle files from.
          # Absent when this publish carried no entry_bundle_b64.
          [ -d attestation ] && git add attestation/ || true
          # Decide "no changes" from the STAGED index/json/attestation only —
          # NOT `git status --porcelain`, which also sees this job's own
          # `milpa fetch`/`milpa hash` re-lock churn on milpa.lock and would
          # otherwise proceed into an empty `git commit` (same latent bug
          # already fixed in vendor.yaml/backfill-attestation.yaml).
          if git diff --cached --quiet; then
            echo "no changes (already up-to-date)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish: ${{ steps.payload.outputs.name }} ${{ steps.payload.outputs.version }} (run:${{ github.run_id }})"
          # Rebase before push — another commit (vendor pass, parallel
          # publish, etc.) may have landed during this workflow.
          # --autostash: milpa fetch / milpa hash (the OCI pull during
          # "Add entry") re-lock milpa.lock and leave it dirty, which would
          # otherwise abort the rebase with "cannot pull with rebase: You
          # have unstaged changes" — the same fix vendor.yaml already carries.
          # Track push success explicitly (not just `break` on the retry
          # loop): the attest-index job below trusts `outputs.changed` to
          # mean "main now has this commit" — a silently-lost push would
          # otherwise make attest-index sign a bundle for a commit main
          # never received.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true; break
            fi
            echo "push attempt $i failed; will retry"
            sleep $((i * 2))
          done
          if [[ "$pushed" != true ]]; then
            echo "::error::commit-entry push failed after 3 attempts"; exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # rfc-registry-trust-federation.md §4/§7.3 (TNG-INDEX-BUNDLE-MISSING) —
  # every author publish that commits index.kdl must re-sign the whole-index
  # bundle milpa's index-trust verifier fetches at `index.kdl.bundle`, or
  # that bundle's subject digest goes stale the moment this publish lands.
  # Separate job (not inlined above) so its OIDC token's `job_workflow_ref`
  # — the Fulcio cert SAN milpa checks — is `attest-index.yaml`, the SAME
  # identity `vendor.yaml`'s own call into this reusable workflow produces,
  # regardless of which top-level workflow triggered it.
  attest-index:
    needs: add-entry
    if: needs.add-entry.outputs.changed == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/attest-index.yaml
